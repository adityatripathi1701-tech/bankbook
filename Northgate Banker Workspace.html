<style>
/* Layout: fixed left sidebar + sticky top bar; content is scannable cards and tables. Off-canvas sidebar under 920px. */

  --ok:#6fd29a; --ok-bg:#15342a; --warn:#f0b857; --warn-bg:#3a2d12; --crit:#ff9188; --crit-bg:#3d1a18; --info:#82bbf2; --info-bg:#162a3c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#4cc2b3; --accent-fg:#06201d; --accent-soft:#18413c; --side:#091110; --side-fg:#b7cfca; --side-active:#16332f;
  --ok:#6fd29a; --ok-bg:#15342a; --warn:#f0b857; --warn-bg:#3a2d12; --crit:#ff9188; --crit-bg:#3d1a18; --info:#82bbf2; --info-bg:#162a3c;

<script>
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const chip=(t,k='')=>`<span class="chip ${k}">${esc(t)}</span>`;
const uid=p=>p+Math.random().toString(36).slice(2,8);
const ICON={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

  const claim=S.claims.find(x=>x.customerId===cid&&x.offerId===oid&&x.expiresAt>t);
  const r={events,last,claim,reasons:[],info:[],hard:false,blocked:false,cooldownUntil:null,status:'Available',detail:''};
  if(c.dnc||c.suppressed){r.hard=true;r.reasons.push({type:'dnc',msg:'This customer has opted out of offer contact (do-not-contact or suppression flag). Outreach cannot be started and exceptions are not available.'});}
  if(claim&&claim.userId!==uidv){r.blocked=true;r.reasons.push({type:'claim',msg:`${uname(claim.userId)} claimed this outreach at ${fmtT(claim.at)}. The hold runs until ${fmtT(claim.expiresAt)}.`})}
  if(claim&&claim.userId===uidv)r.info.push('You hold the claim for this outreach.');
  if(last){
    const days=last.status==='Declined'?S.settings.declineCooldownDays:cooldownDaysFor(oid);
    r.cooldownUntil=last.at+days*DAY;r.cooldownDays=days;
    if(r.cooldownUntil>t){
      const ownCb=last.status==='Awaiting callback'&&last.userId===uidv;
      if(ownCb)r.info.push('You recorded this callback request. Following it up is allowed.');
      else{r.blocked=true;r.reasons.push({type:last.status==='Declined'?'declined':'cooldown',msg:last.status==='Declined'
        ?`The customer declined this offer on ${fmtD(last.at)} (recorded by ${uname(last.userId)}). Declined offers rest for ${days} days, until ${fmtD(r.cooldownUntil)}.`
        :`${uname(last.userId)} contacted this customer about this offer by ${last.channel} ${ago(last.at)} (${last.outcome}). Cooldown of ${days} days runs until ${fmtD(r.cooldownUntil)}.`})}
    }
  }
  if(r.hard){r.status='Do not contact';r.detail='Opted out'}
  else if(claim){r.status='Claimed';r.detail=`${uname(claim.userId)} · until ${fmtT(claim.expiresAt)}`}
  else if(last&&r.cooldownUntil>t){r.status=last.status;r.detail=`${uname(last.userId)} · ${last.channel} · ${ago(last.at)} · cooldown to ${fmtD(r.cooldownUntil)}`}
  else if(last){r.detail=`Last contact ${ago(last.at)} by ${uname(last.userId)}; cooldown over`}
  r.inCooldown=!!(last&&r.cooldownUntil>t);
  return r;
}

const DOWS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parseDue(text){
  const s=text.toLowerCase(),b=new Date(),mk=(d,h=17,m=30)=>{d.setHours(h,m,0,0);return d.getTime()};
  if(/\btoday\b|\beod\b|end of (the )?day/.test(s))return{t:mk(new Date()),found:true};
  if(/\btomorrow\b/.test(s)){const d=new Date();d.setDate(d.getDate()+1);return{t:mk(d),found:true}}
  let m=s.match(/\bin (\d+) (?:working )?days?\b/);if(m){const d=new Date();d.setDate(d.getDate()+ +m[1]);return{t:mk(d),found:true}}
  m=s.match(/\b(next )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
  if(m){const d=new Date();let diff=(DOWS.indexOf(m[2])-d.getDay()+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return{t:mk(d),found:true}}
  if(/\bthis week\b/.test(s)){const d=new Date();let diff=(5-d.getDay()+7)%7;d.setDate(d.getDate()+diff);return{t:mk(d),found:true}}
  const d=new Date();d.setDate(d.getDate()+1);return{t:mk(d),found:false};
}
function findCustomer(sent){const s=sent.toLowerCase();
  let c=S.customers.find(c=>s.includes(c.name.toLowerCase()));if(c)return c;
  return S.customers.find(c=>{const f=c.name.split(' ')[0].toLowerCase();return f.length>=5&&new RegExp('\\b'+f+'\\b').test(s)})||null}
function findOwner(sent){
  for(const u of staff()){const f=u.name.split(' ')[0];if(new RegExp('^\\W*'+f+'\\b','i').test(sent)||new RegExp('\\b'+f+'\\s+(will|to|should|must)\\b','i').test(sent))return u.id}
  return ui.uid}
const sentences=txt=>txt.replace(/\r/g,'').split(/\n+|(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>8);
const clean=s=>s.replace(/^[-•*\d.)\s]+/,'').replace(/[.\s]+$/,'');
function aiMeeting(text,title){
  const S_=sentences(text),tasks=[],decisions=[],targets=[],reminders=[];
  S_.forEach(s=>{
    const low=s.toLowerCase();
    if(/\btarget|\bgoal|\baim\b/.test(low)){
      const after=s.split(/\b(?:is|of|are|:)\s+(?=\d)/i)[1]||'';
      after.split(/,|\band\b/).forEach(p=>{const m=p.trim().match(/^(\d[\d,]*)\s+([a-z][a-z \-]+?)\.?$/i);if(m)targets.push({name:m[2].trim().replace(/^./,x=>x.toUpperCase()),goal:+m[1].replace(/,/g,''),period:(low.match(/this (week|month|quarter)/)||['','period'])[0].replace(/^./,x=>x.toUpperCase()),src:s,keep:true})});
      return}
    if(/\bremind|check back|call back|callback/.test(low)&&/\bremind|check back/.test(low)){
      const d=parseDue(s);const dt=new Date(d.t);dt.setHours(10,0,0,0);reminders.push({title:clean(s).slice(0,110),at:lin(dt.getTime()),assumed:!d.found,src:s,keep:true});return}
    if(/\b(decided|agreed|decision|from now|going forward|instruction|policy)\b/.test(low)){decisions.push({text:clean(s),src:s,keep:true});return}
    if(/\b(will|to|should|please|must|needs? to)\b/.test(low)&&/\b(call|visit|send|collect|submit|check|review|update|prepare|follow|verify|confirm|log|chase|share)\b/.test(low)){
      const d=parseDue(s),c=findCustomer(s);
      tasks.push({title:clean(s).slice(0,120),ownerId:findOwner(s),due:din(d.t),assumed:!d.found,customerId:c?c.id:'',src:s,keep:true})}
  });
  const key=S_.filter(s=>/target|decid|agreed|priority|follow|visit|issue|paperwork/i.test(s)).slice(0,3);
  const summary=(key.length?key:S_.slice(0,3)).map(clean).join('. ')+'.';
  return{title:title||'Meeting notes',date:din(now()),summary,decisions,tasks,targets,reminders};
}
function aiInteraction(text,cid){
  const low=text.toLowerCase(),offerHit=S.offers.find(o=>low.includes(o.name.toLowerCase().split(' ')[0])&&low.includes(o.name.toLowerCase().split(' ')[1]||''));
  let channel='In person';if(/\bcalled|phone|call\b/.test(low))channel='Phone';if(/e-?mail/.test(low))channel='Email';if(/whatsapp/.test(low))channel='WhatsApp';if(/\bsms\b|text message/.test(low))channel='SMS';
  let outcome='Information shared';if(/declin|not interested/.test(low))outcome='Declined';else if(/call ?back|callback|get back|think about|wants to think|will revert/.test(low))outcome='Awaiting callback';else if(/not available|closed|no answer/.test(low))outcome='Not reachable';else if(/interested|agreed|keen/.test(low))outcome='Interested – follow-up agreed';
  const sents=sentences(text),nextS=sents.find(s=>/follow|call back|send|collect|revisit|check back/i.test(s));
  const topic=offerHit?offerHit.name:(sents[0]?clean(sents[0]).split(' ').slice(0,7).join(' '):'Customer discussion');
  return{customerId:cid,date:lin(now()),channel,topic,outcome,notes:sents.map(clean).join('. ')+'.',nextAction:nextS?clean(nextS):''};
}

function setPath(o,p,v){const k=p.split('.');let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=v}
function syncDraft(){const d=S.drafts.find(x=>x.id===ui.draftId);if(!d||d.kind!=='meeting')return d;$$('#view [data-d]').forEach(el=>{try{setPath(d.data,el.dataset.d,el.type==='checkbox'?el.checked:el.value)}catch(e){}});return d}

const dS=(p,o,v,l)=>`<select data-d="${p}" aria-label="${esc(l)}">${opt(o,v)}</select>`;
const dC=(p,v,l)=>`<input type="checkbox" data-d="${p}" ${v?'checked':''} aria-label="${esc(l)}">`;
const ownerOpts=()=>staff().map(u=>[u.id,u.name]);
const custOpts=(blank)=>(blank?[['',blank]]:[]).concat(S.customers.map(c=>[c.id,c.name+' · '+c.ref]));
function meetingReview(d){

  return `<div class="card" id="review"><header><h2>Review AI draft</h2>${chip('AI draft · not saved','ai')}</header>
  <div class="banner ai"><span>${ic('spark',16)}</span><div><b>Check each item against the source note.</b> Nothing is saved or assigned until you confirm. Edit, untick or add anything. ${esc(S.settings.aiMode)}.</div></div>
  <div class="grid" style="margin-top:12px">
  <div class="f"><label for="d-title">Meeting title</label><input id="d-title" data-d="title" value="${esc(x.title)}"></div>
  <div class="f"><label for="d-sum">Summary</label><textarea id="d-sum" data-d="summary">${esc(x.summary)}</textarea></div>
  <div><h3>Decisions and instructions</h3>${rows(x.decisions,(a,i)=>`<div class="item">${dC(`decisions.${i}.keep`,a.keep,'Keep decision')}<div class="grow">${dI(`decisions.${i}.text`,a.text,'Decision text','style="width:100%"')}${srcBtn(a.src)}</div></div>`)}</div>
  <div><h3>Daily tasks (proposed owners and due dates)</h3>${rows(x.tasks,(a,i)=>`<div class="item">${dC(`tasks.${i}.keep`,a.keep,'Create this task')}<div class="grow" style="display:flex;flex-direction:column;gap:6px">${dI(`tasks.${i}.title`,a.title,'Task title')}<div class="row">${dS(`tasks.${i}.ownerId`,ownerOpts(),a.ownerId,'Owner')}<input type="date" data-d="tasks.${i}.due" value="${a.due}" aria-label="Due date">${dS(`tasks.${i}.customerId`,custOpts('No customer'),a.customerId,'Customer')}${a.assumed?chip('Date not in notes: proposed','assume'):''}</div>${srcBtn(a.src)}</div></div>`)}</div>
  <div><h3>Targets mentioned</h3>${rows(x.targets,(a,i)=>`<div class="item">${dC(`targets.${i}.keep`,a.keep,'Add this target')}<div class="grow"><div class="row">${dI(`targets.${i}.name`,a.name,'Target name')}<input type="number" min="1" data-d="targets.${i}.goal" value="${a.goal}" aria-label="Target value" style="width:90px"><span class="muted small">${esc(a.period)} · added to ${esc(cur().name.split(' ')[0])}'s targets</span></div>${srcBtn(a.src)}</div></div>`)}</div>
  <div><h3>Follow-up reminders</h3>${rows(x.reminders,(a,i)=>`<div class="item">${dC(`reminders.${i}.keep`,a.keep,'Create this reminder')}<div class="grow" style="display:flex;flex-direction:column;gap:6px">${dI(`reminders.${i}.title`,a.title,'Reminder text')}<div class="row"><input type="datetime-local" data-d="reminders.${i}.at" value="${a.at}" aria-label="Reminder time">${a.assumed?chip('Time not in notes: proposed','assume'):''}</div>${srcBtn(a.src)}</div></div>`)}</div></div>
  <div class="mfoot" style="margin-top:12px"><button class="btn" data-act="draft-discard">Discard draft</button><button class="btn" data-act="draft-add-task">Add task row</button><button class="btn pri" data-act="draft-confirm">${ic('check',16)}Confirm and save</button></div></div>`}

  <form data-form="meeting-draft" class="grid"><div class="fg"><div class="f"><label for="f-title">Title</label><input id="f-title" name="title" value="Lakeview huddle" required></div>
  <div class="f"><label for="f-src">Source</label><select id="f-src" name="src" data-filter="src"><option${st==='Typed notes'?' selected':''}>Typed notes</option><option${st==='Pasted transcript'?' selected':''}>Pasted transcript</option><option value="Recording"${st==='Recording'?' selected':''}>Recording (not enabled)</option></select></div></div>
  ${st==='Pasted transcript'?`<label class="row"><input type="checkbox" name="consent" id="f-consent"> <span>All participants were told this meeting is transcribed and agreed. Transcript kept for ${S.settings.transcriptRetentionDays} days, visible to the attendees and managers only.</span></label>`:''}
  ${st==='Recording'?`<div class="banner warn"><div><b>Audio capture is off.</b> Nothing is ever recorded automatically. An admin must enable capture with an approved transcription service, consent wording and a retention period. Until then, paste a transcript or type notes.</div></div>`:`<div class="f"><label for="f-note">${st==='Typed notes'?'Meeting notes':'Approved transcript'}</label><textarea id="f-note" name="note" rows="12" style="min-height:240px" required placeholder="Type or paste notes. One instruction per line works best.">${esc(ui.filters.note||'')}</textarea></div>`}
  <div class="mfoot"><button type="button" class="btn" data-act="meeting-sample">Load sample note</button><button class="btn pri" ${st==='Recording'?'disabled':''}>${ic('spark',16)}Draft with AI</button></div></form>`}</div>`;
  return `${vhead('Turn notes into a summary, tasks, targets and reminders. You review and confirm everything before it is saved or assigned.')}
  <div class="grid g2e" style="align-items:start">${compose}${d?meetingReview(d):`<div class="card"><header><h2>How drafts work</h2></header><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px"><li>The draft keeps a link to the note it came from.</li><li>Each task, target and reminder shows the sentence it was taken from.</li><li>Owners and dates the notes did not state are marked as proposed.</li><li>Recording is never started automatically.</li></ul></div>`}</div>
  ${mine.length?`<div class="card"><header><h2>Your unconfirmed drafts</h2></header><ul class="list">${mine.map(x=>`<li class="item"><div class="grow"><div class="t">${esc(x.data.title)}</div><div class="meta">${chip('AI draft','ai')}${ago(x.createdAt)}</div></div><button class="btn sm" data-act="draft-resume" data-id="${x.id}">Resume</button></li>`).join('')}</ul></div>`:''}
  <div class="card"><header><h2>Saved meetings</h2></header>${S.meetings.length?`<ul class="list">${S.meetings.slice().sort((a,b)=>b.date-a.date).map(m=>`<li class="item"><div class="grow"><div class="t">${esc(m.title)} <span class="muted small">· ${fmtD(m.date)} · ${esc(m.sourceType)}</span></div><div class="small">${esc(m.summary)}</div><div class="meta">${m.taskIds.length} task(s) · confirmed by ${esc(uname(m.createdBy))}</div></div><div class="acts"><button class="btn sm" data-act="meeting-view" data-id="${m.id}">View source</button><button class="btn sm" data-act="draft-int-meeting" data-id="${m.id}">Draft interaction update</button></div></li>`).join('')}</ul>`:empty('No saved meetings','Draft your first one above.')}</div>`;

function vVisits(){
  const view=ui.filters.vmode||'list',list=scope(S.visits).filter(v=>!ui.filters.vtype||ui.filters.vtype==='all'||v.type===ui.filters.vtype);
  const m=ui.calMonth||(ui.calMonth=sod(now())),md=new Date(m);md.setDate(1);md.setHours(0,0,0,0);

  let cal='';
  if(view==='cal'){cal=`<div class="card"><header><div class="row"><button class="btn sm" data-act="cal-prev" aria-label="Previous month">‹</button><h2 id="calh">${md.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2><button class="btn sm" data-act="cal-next" aria-label="Next month">›</button></div><span class="small muted">Select a day to filter the list</span></header><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}`;
    for(let i=0;i<42;i++){const d=new Date(startGrid);d.setDate(d.getDate()+i);const t=d.getTime(),vs=list.filter(v=>sod(v.start)===t);
      cal+=`<button class="day${d.getMonth()!==md.getMonth()?' out':''}${ui.calDay===t?' sel':''}${t===sod(now())?' tdy':''}" data-act="cal-day" data-t="${t}" aria-label="${fmtDW(t)}, ${vs.length} visits"><b>${d.getDate()}</b>${vs.slice(0,2).map(v=>`<span class="ev ${v.type!=='Planned visit'?'u':''}">${esc(cust(v.customerId).name.split(' ')[0])}</span>`).join('')}${vs.length>2?`<span class="small muted">+${vs.length-2}</span>`:''}</button>`}
    cal+='</div></div>'}

   <td><div class="row"><button class="btn sm" data-act="visit-edit" data-id="${v.id}">${v.status==='Planned'?'Record outcome':'Edit'}</button>${v.status==='Completed'&&v.remarks?`<button class="btn sm" data-act="draft-int-visit" data-id="${v.id}">Draft interaction</button>`:''}</div></td></tr>`;
  const tbl=(l,e)=>l.length?`<div class="tw"><table><thead><tr><th>When</th><th>Customer</th><th>Type</th><th>Location label</th><th>Outcome</th><th>Actions</th></tr></thead><tbody>${l.map(row).join('')}</tbody></table></div>`:empty(e[0],e[1]);
  return `${vhead('Record planned visits and unplanned or cold-call visits. Locations are typed by you; the app never tracks your position.',`<button class="btn pri" data-act="visit-add">${ic('plus',16)}Add visit</button>`)}
  <div class="filters"><div class="seg" role="group" aria-label="View"><button data-act="vmode" data-v="list" aria-pressed="${view==='list'}">List</button><button data-act="vmode" data-v="cal" aria-pressed="${view==='cal'}">Calendar</button></div>
  <div class="f"><label for="f-vtype">Visit type</label><select id="f-vtype" data-filter="vtype">${opt([['all','All types'],'Planned visit','Unplanned visit','Cold-call visit'],ui.filters.vtype||'all')}</select></div>${ownerFilter()}${ui.calDay&&view==='cal'?`<button class="btn sm" data-act="cal-clear">Clear day filter</button>`:''}</div>
  ${cal}<h2>Planned</h2>${tbl(planned,['No planned visits','Add a visit to start your calendar.'])}<h2>Completed and cancelled</h2>${tbl(doneV,['No completed visits yet','Open a planned visit and record the outcome.'])}`;
}

/* ============ Issues ============ */
const ISTAT=['Open','In Progress','Waiting on Customer','Waiting on Team','Resolved','Reopened'];
const skind=s=>({'Open':'info','In Progress':'info','Waiting on Customer':'warn','Waiting on Team':'warn','Resolved':'ok','Reopened':'crit'}[s]||'');
function tatCell(i){if(i.status==='Resolved')return chip('Resolved','ok');const s=i.due<now()?'crit':(i.due-now()<4*HR?'warn':'');return `<div>${fmtDT(i.due)}</div><span class="chip ${s}">${i.due<now()?'⚠ ':''}${remaining(i.due)}</span>`}
function vIssues(){
  const f=ui.filters;let l=scope(S.issues);
  if(f.istat&&f.istat!=='all')l=l.filter(i=>f.istat==='active'?i.status!=='Resolved':i.status===f.istat);else if(!f.istat)l=l.filter(i=>i.status!=='Resolved');

  ${l.length?`<div class="tw"><table><thead><tr><th>Customer / issue</th><th>Priority</th><th>Owner</th><th>Status</th><th>TAT / deadline</th><th>Next action</th><th></th></tr></thead><tbody>${l.map(i=>`<tr><td>${custLink(i.customerId)}<div><b>${esc(i.type)}</b></div><div class="small muted">${esc(i.desc.slice(0,80))}${i.desc.length>80?'…':''}</div></td><td>${chip(i.priority,i.priority==='High'?'crit':i.priority==='Medium'?'warn':'')}</td><td>${esc(uname(i.ownerId))}${i.escalatedTo?`<div>${chip('Escalated to '+uname(i.escalatedTo),'warn')}</div>`:''}</td><td>${chip(i.status,skind(i.status))}</td><td>${tatCell(i)}</td><td>${esc(i.next||'—')}${i.nextDue&&i.status!=='Resolved'?`<div class="small muted">${fmtDT(i.nextDue)}</div>`:''}</td><td><button class="btn sm" data-act="issue-open" data-id="${i.id}">Open</button></td></tr>`).join('')}</tbody></table></div>`:empty('No issues match','Change the filters or log a new issue.','<button class="btn" data-act="issue-add">New issue</button>')}`;

   ${open.length?`<div class="banner ${p.due<now()?'crit':'warn'}"><div><b>Still needed before ${fmtDT(p.due)}:</b> ${open.map(i=>esc(i.docName)).join('; ')}.</div></div>`:`<div class="banner ok"><div><b>Checklist complete.</b> All items are verified or submitted.</div></div>`}

/* ============ Assistant ============ */
function suggestions(){
  const u=cur(),t=now(),out=[],held=[];
  const custs=S.customers.filter(c=>c.ownerId===u.id||S.tasks.some(x=>x.ownerId===u.id&&x.status==='open'&&x.customerId===c.id));
  custs.forEach(c=>{
    let score=0;const why=[];
    S.tasks.filter(x=>x.ownerId===u.id&&x.status==='open'&&x.customerId===c.id).forEach(x=>{const s=timeState(x.due);if(s==='overdue'){score+=3;why.push([`Task overdue: “${x.title}” (due ${fmtDT(x.due)})`,'Task '+x.id])}else if(s==='today'){score+=2;why.push([`Task due today: “${x.title}”`,'Task '+x.id])}else if(x.due<t+2*DAY){score+=1;why.push([`Task due ${fmtDW(x.due)}: “${x.title}”`,'Task '+x.id])}});
    S.issues.filter(i=>i.ownerId===u.id&&i.customerId===c.id&&i.status!=='Resolved').forEach(i=>{score+=i.due<t?3:1.5;why.push([`Open ${i.type} issue, status ${i.status}. TAT: ${remaining(i.due)}`,'Issue '+i.id])});
    S.paperwork.filter(p=>p.customerId===c.id&&p.ownerId===u.id&&caseOpen(p).length).forEach(p=>{score+=p.due<t?2.5:1;why.push([`${caseOpen(p).length} paperwork item(s) missing for ${proc(p.processId).title}; deadline ${fmtDT(p.due)}`,'Paperwork '+p.id+' · '+proc(p.processId).title+' v'+proc(p.processId).version])});
    S.visits.filter(v=>v.customerId===c.id&&v.ownerId===u.id&&v.status==='Planned'&&v.start<t+DAY).forEach(v=>{score+=1.5;why.push([`Visit planned ${fmtDT(v.start)}`,'Visit '+v.id])});
    const last=S.interactions.filter(x=>x.customerId===c.id).sort((a,b)=>b.date-a.date)[0];
    if(!last||t-last.date>30*DAY){score+=.5;why.push([last?`No logged interaction for ${Math.floor((t-last.date)/DAY)} days`:'No interaction logged yet','Interaction log'])}
    let pair=null;
    S.pool.filter(p=>p.customerId===c.id&&p.ownerId===u.id).forEach(p=>{
      const chk=checkPair(c.id,p.offerId,u.id),o=offer(p.offerId);
      if(chk.hard){held.push([c.name,o.name,'Customer has opted out. Not suggested.','Customer preference / suppression flag']);return}
      if(chk.blocked){held.push([c.name,o.name,chk.reasons[0].msg,'Shared outreach history']);return}
      if(chk.last&&chk.last.status==='Awaiting callback'&&chk.last.userId===u.id){score+=2;why.push([`You recorded a callback request ${ago(chk.last.at)} for ${o.name}`,'Outreach event'])}
      const tg=S.targets.find(g=>g.ownerId===u.id&&g.offerId===p.offerId);
      if(!pair){pair=p.offerId;score+=tg&&tg.achieved<tg.goal?1:.5;why.push([`${o.name} appears on your outreach list under approved rule ${o.ruleId} (${p.basis}). This is a listing rule, not an eligibility decision${tg?`; target status ${tg.achieved} of ${tg.goal}`:''}`,'Offer rule '+o.ruleId])}
    });
    if(score>0)out.push({c,score,why,pair,ch:c.channels[0]||null});
  });
  return{out:out.sort((a,b)=>b.score-a.score),held};
}
const DISC='Suggestions are for planning only. They are not credit, eligibility, pricing or suitability decisions, and never override a customer\'s contact preferences.';
function botSuggest(){
  const{out,held}=suggestions();
  return `<div><b>Customers to connect with next</b></div>${out.length?out.slice(0,4).map(s=>`<div class="card flat" style="padding:10px"><div class="row" style="justify-content:space-between"><b><a href="#customer-${s.c.id}" data-act="assist-close">${esc(s.c.name)}</a></b>${chip(s.ch?'Preferred: '+s.ch:'No channel on file',s.ch?'':'warn')}</div><div style="display:flex;flex-direction:column;gap:6px;margin-top:6px"><div class="small muted">Why suggested</div>${s.why.slice(0,4).map(w=>`<div class="why"><span>${esc(w[0])}</span><span class="src">Source: ${esc(w[1])}</span></div>`).join('')}</div><div class="row" style="margin-top:8px"><button class="btn sm" data-act="assist-open-c" data-c="${s.c.id}">Open record</button>${s.pair?`<button class="btn sm" data-act="out-check" data-c="${s.c.id}" data-o="${s.pair}">Check outreach</button>`:''}</div></div>`).join(''):'<p>No customers stand out today. Check your tasks and reminders.</p>'}
  ${held.length?`<details><summary class="small">Held back (${held.length})</summary>${held.map(h=>`<div class="why" style="margin-top:6px"><span><b>${esc(h[0])}</b> · ${esc(h[1])}: ${esc(h[2])}</span><span class="src">Source: ${esc(h[3])}</span></div>`).join('')}</details>`:''}
  <div class="small muted">${DISC}</div>`;
}
function botPending(){
  const u=cur(),iss=S.issues.filter(i=>i.ownerId===u.id&&i.status!=='Resolved').sort((a,b)=>a.due-b.due),rem=S.reminders.filter(r=>r.ownerId===u.id&&r.status==='active').sort((a,b)=>a.at-b.at).slice(0,5),pw=S.paperwork.filter(p=>p.ownerId===u.id&&caseOpen(p).length).sort((a,b)=>a.due-b.due);
  return `<b>Pending items and deadlines</b><div class="small muted">Issues (TAT)</div>${iss.map(i=>`<div class="why"><span>${esc(cust(i.customerId).name)} · ${esc(i.type)} · ${chip(remaining(i.due),i.due<now()?'crit':'')}</span><span class="src">Source: Issue ${i.id}</span></div>`).join('')||'<p class="small">None.</p>'}<div class="small muted">Paperwork deadlines</div>${pw.map(p=>`<div class="why"><span>${esc(cust(p.customerId).name)} · ${esc(proc(p.processId).title)} · ${chip(remaining(p.due),p.due<now()?'crit':'')} · ${caseOpen(p).length} missing</span><span class="src">Source: ${p.id} · ${esc(proc(p.processId).title)} v${proc(p.processId).version}</span></div>`).join('')||'<p class="small">None.</p>'}<div class="small muted">Reminders</div>${rem.map(r=>`<div class="why"><span>${esc(r.title)} · ${dueChip(r.at)}</span><span class="src">Source: Reminder ${r.id}</span></div>`).join('')||'<p class="small">None.</p>'}`;
}
function botProcess(q){
  const ok=S.processes.filter(p=>p.status==='Approved'),low=(q||'').toLowerCase();
  const p=ok.find(p=>p.title.toLowerCase().split(/[ –-]+/).filter(w=>w.length>3).some(w=>low.includes(w)));
  if(!p)return `<b>Which process?</b><div class="small">Approved documents available:</div><div class="row">${ok.map(x=>`<button class="btn sm" data-act="assist-proc" data-id="${x.id}">${esc(x.title)}</button>`).join('')}</div>`;
  return botProcDoc(p);
}
const botProcDoc=p=>`<b>${esc(p.title)}</b><div class="small muted">Approved version ${p.version} · ${fmtD(p.approvedOn)} · TAT ${esc(p.tat)}</div><div class="small">Required documents and actions:</div>${p.docs.map(d=>`<div class="why"><span>${esc(d[0])} <span class="chip">${d[2]==='doc'?'Document':'Action'}</span></span><span class="src">Source: ${esc(p.title)} v${p.version} ${d[1]}</span></div>`).join('')}<button class="btn sm" data-act="proc-open" data-id="${p.id}">Open source document</button><div class="small muted">Summary only. The source document is the authority.</div>`;
function botDraft(){
  const{out}=suggestions(),items=out.slice(0,4).map(s=>({title:`Follow up with ${s.c.name}: ${s.why[0][0].replace(/^[^:]+: /,'').slice(0,70)}`,customerId:s.c.id}));
  const idx=ui.chat.length;ui.chat.push({role:'drafts',items});
  return `<b>Draft task list for your review</b><div class="small muted">Nothing is added until you press the button.</div>${items.map((x,i)=>`<label class="row"><input type="checkbox" data-dt="${idx}-${i}" checked> <span>${esc(x.title)}</span></label>`).join('')||'<p class="small">No drafts to suggest.</p>'}${items.length?`<button class="btn sm pri" data-act="assist-add-tasks" data-m="${idx}">Review and add selected</button>`:''}<span class="chip ai">AI draft</span>`;
}
function assistantReply(q){
  const low=q.toLowerCase();
  if(/eligib|qualif|approve|credit|loan limit|price|pricing|interest rate|suitab|should .* buy|best product/.test(low))return `<b>I can't decide that.</b><div>I don't make credit, eligibility, pricing or suitability decisions. Please use the approved product rules and the bank's formal process. I can show the approved process document or help you plan the conversation.</div><button class="btn sm" data-act="assist-q" data-q="Summarize process">Show process documents</button>`;
  if(/process|document|paperwork requ|required|mandate|nominee|address|summar/.test(low))return botProcess(q);
  if(/pending|issue|remind|tat|deadline|overdue/.test(low))return botPending();
  if(/draft|task list|follow.?up note/.test(low))return botDraft();
  if(/next|connect|who|suggest|call|customer/.test(low))return botSuggest();
  return `<div>I can suggest who to connect with, summarize approved processes, list pending items and TAT deadlines, and draft task lists for your review.</div>`;
}

}

function renderDrawer(){
  const d=$('#dlayer');if(!ui.assistOpen){d.innerHTML='';return}
  const msgs=ui.chat.map(m=>m.role==='me'?`<div class="msg me">${esc(m.text)}</div>`:m.role==='bot'?`<div class="msg">${m.html}</div>`:'').join('');

  <div class="row" style="padding:0 16px 8px">${[['Who should I connect with next?','Who next'],['What is pending or near TAT?','Pending & TAT'],['Summarize an approved process','Process summary'],['Draft a follow-up task list','Draft tasks']].map(x=>`<button class="btn sm" data-act="assist-q" data-q="${esc(x[0])}">${x[1]}</button>`).join('')}</div>

function outResult(r,d){
  if(r.ok){closeModal();toast(`Claimed. Hold ends ${fmtT(r.claim.expiresAt)}. Log the outcome when you finish.`);renderAll();return}
  const msg={hard:'Not allowed: the customer has opted out.',channel:'That channel is not allowed by the customer.',conflict:'Not claimed: someone else got there first, or a cooldown now applies. The screen has refreshed.',error:'Something went wrong. Try again.'}[r.code];
  toast(msg);renderAll();if(r.code!=='error')outModal(d.c,d.o)}

/* ============ events ============ */
document.addEventListener('click',e=>{
  if(!e.target.closest('.search')){const r=$('#sres');if(r)r.hidden=true}
  if(!e.target.closest('.tools')){const p=$('#bellpop');if(p)p.hidden=true}
  if(e.target.closest('.side a'))document.body.classList.remove('nav-open');
  const el=e.target.closest('[data-act]');if(!el)return;const a=acts[el.dataset.act];if(a)a(el,e);
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=forms[f.dataset.form];if(h)h(Object.fromEntries(new FormData(f)),f)});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-filter]');
  if(el){if(el.dataset.filter==='src'){const n=$('#f-note');if(n)ui.filters.note=n.value}ui.filters[el.dataset.filter]=el.value;renderAll();return}
  if(e.target.id==='gsearch'){const q=e.target.value.trim().toLowerCase(),r=$('#sres');if(!q){r.hidden=true;return}
    const m=S.customers.filter(c=>(c.name+' '+c.ref).toLowerCase().includes(q)).slice(0,6);
    r.innerHTML=m.length?m.map(c=>`<a href="#customer-${c.id}" data-close-search><b>${esc(c.name)}</b><div class="small muted">${esc(c.ref)} · ${esc(c.segment)} · ${esc(c.branch)}</div></a>`).join(''):'<div class="none">No customers match. Try a name or reference.</div>';r.hidden=false}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='userSel'){ui.uid=el.value;try{sessionStorage.setItem(SS,ui.uid)}catch(x){}closeModal();ui.assistOpen=false;renderDrawer();ui.chat=[];ui.draftId=null;ui.filters={};renderShell();if(!canOpen(ui.route)&&ui.route!=='customer'){}renderAll();toast('Now viewing as '+cur().name+' ('+RLABEL[cur().role]+').');return}
  const c=el.dataset&&el.dataset.chg;if(!c)return;
  if(c==='issue-type'){const h=(S.settings.issueTypes.find(x=>x[0]===el.value)||[0,72])[1];$('#f-due').value=lin(now()+h*HR)}
  if(c==='rem-type'){$('#f-linkedId').innerHTML=remTargets(el.value)}
  if(c==='user-role'){mutate(s=>{const u=user(el.dataset.id),o=u.role;u.role=el.value;audit('user',u.id,'user.role',`${u.name}: ${o} → ${u.role}`)},'Role updated.');renderShell()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#layer').innerHTML)closeModal();else if(ui.assistOpen){ui.assistOpen=false;renderDrawer()}$('#bellpop')&&($('#bellpop').hidden=true);$('#sres')&&($('#sres').hidden=true)}
  if(e.key==='Enter'&&e.target.id==='gsearch'){const a=$('#sres a');if(a){location.hash=a.getAttribute('href').slice(1);$('#sres').hidden=true;e.target.value=''}}
});
window.addEventListener('hashchange',()=>{parseHash();if(!canOpen(ui.route)&&ui.route!=='customer'){}renderAll();runAfter();window.scrollTo(0,0)});
window.addEventListener('storage',e=>{if(e.key===LS&&S){const s=Server.load();if(s&&s.version>S.version){S=s;renderAll();renderDrawer();toast('Shared status updated by a teammate.')}}});
setInterval(()=>{if(S&&!ui.loading&&!$('#layer').innerHTML&&!document.activeElement.closest('#view input,#view textarea,#view select'))renderAll()},60000);

/* ============ boot ============ */
(function boot(){
  const dl=document.createElement('div');dl.id='dlayer';document.body.appendChild(dl);
  try{loadState()}catch(e){ui.error=String(e&&e.message||e)}
  if(S)renderShell();else $('#top').innerHTML='<h1 id="ptitle">Banker workspace</h1>';
  parseHash();renderAll();
  setTimeout(()=>{ui.loading=false;renderAll();runAfter()},450);
})();
</script>

</body></html>
