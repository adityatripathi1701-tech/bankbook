  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="h-full overflow-hidden text-slate-800 bg-slate-50 flex flex-col">

  <!-- Top Global Navigation Bar -->
  <header class="bg-indigo-900 text-white h-14 px-4 flex items-center justify-between shrink-0 shadow-md z-30">

      <div class="flex items-center space-x-2">

          <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>

        <span class="font-bold text-lg tracking-tight">OmniBanker <span class="text-indigo-300 font-normal text-sm px-1.5 py-0.5 bg-indigo-800 rounded">Branch Workspace</span></span>

      <div class="hidden md:flex items-center bg-indigo-950/60 rounded-lg px-3 py-1.5 w-72 border border-indigo-700/50">
        <i data-lucide="search" class="w-4 h-4 text-indigo-300 mr-2"></i>
        <input type="text" id="globalSearchInput" placeholder="Search customer, ID, or task..." class="bg-transparent text-xs text-white placeholder-indigo-300 focus:outline-none w-full" oninput="handleGlobalSearch(this.value)">
      </div>
    </div>
    
    <div class="flex items-center space-x-3">
      <!-- Role Switcher for Demo -->
      <div class="flex items-center bg-indigo-950 rounded-lg p-1 border border-indigo-700/60 text-xs">
        <span class="px-2 text-indigo-300 font-medium hidden sm:inline">Role:</span>
        <button onclick="switchRole('banker')" id="roleBtnBanker" class="px-2.5 py-1 rounded transition-colors font-medium bg-indigo-600 text-white shadow">Banker</button>
        <button onclick="switchRole('manager')" id="roleBtnManager" class="px-2.5 py-1 rounded transition-colors font-medium text-indigo-300 hover:text-white">Manager</button>
        <button onclick="switchRole('admin')" id="roleBtnAdmin" class="px-2.5 py-1 rounded transition-colors font-medium text-indigo-300 hover:text-white">Admin</button>
      </div>

      <!-- Notifications -->
      <div class="relative">
        <button onclick="toggleNotifications()" class="p-2 rounded-lg hover:bg-indigo-800 transition-colors relative">
          <i data-lucide="bell" class="w-5 h-5 text-indigo-200"></i>
          <span id="notifBadge" class="absolute top-1 right-1 bg-rose-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">3</span>
        </button>
        <!-- Notification Dropdown -->
        <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-2xl border border-slate-200 py-2 z-50 text-slate-800">
          <div class="px-4 py-2 border-b border-slate-100 flex justify-between items-center">
            <span class="font-semibold text-xs text-slate-700">Notifications & Escalations</span>
            <span class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-medium">3 New</span>
          </div>
          <div class="max-h-64 overflow-y-auto custom-scrollbar divide-y divide-slate-100" id="notifList">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>

      <!-- User Profile Badge -->
      <div class="flex items-center space-x-2 pl-2 border-l border-indigo-800">
        <div class="w-8 h-8 rounded-full bg-indigo-500 text-white font-bold flex items-center justify-center text-xs shadow" id="userAvatar">AR</div>
        <div class="hidden lg:block text-left">
          <div class="text-xs font-semibold" id="userNameLabel">Aarav Sharma</div>
          <div class="text-[10px] text-indigo-300" id="userRoleLabel">Personal Banker (ID: PB-4029)</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Body Layout -->

    <!-- Left Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 select-none z-20">

      </div>

      <nav class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1" id="sidebarNav">
        <!-- Rendered via JS -->

      <!-- AI Assistant Quick Trigger Card -->
      <div class="p-3 m-3 bg-gradient-to-br from-indigo-50 to-purple-50 rounded-xl border border-indigo-100 shadow-sm">

          <div class="flex items-center space-x-1.5">
            <i data-lucide="sparkles" class="w-4 h-4 text-indigo-600"></i>
            <span class="text-xs font-semibold text-indigo-900">AI Branch Copilot</span>

          <span class="text-[9px] bg-indigo-200/60 text-indigo-800 px-1.5 py-0.5 rounded font-mono">v2.4</span>
        </div>
        <p class="text-[11px] text-slate-600 mb-2">Ready to summarize notes, draft tasks, or suggest next outreach.</p>
        <button onclick="openAiAssistantModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium py-1.5 px-3 rounded-lg shadow transition-colors flex items-center justify-center space-x-1.5">
          <i data-lucide="message-square-code" class="w-3.5 h-3.5"></i>
          <span>Open Copilot Assistant</span>
        </button>
      </div>

      <div class="p-3 border-t border-slate-100 text-[11px] text-slate-400 flex items-center justify-between">
        <span>Demo Environment</span>
        <span class="font-mono text-slate-500">v4.1.0</span>
      </div>
    </aside>

    <!-- Main Content Viewport -->
    <main class="flex-1 overflow-y-auto custom-scrollbar bg-slate-50 flex flex-col relative" id="mainViewport">
      <!-- Dynamic Page Content injected here -->
    </main>

  </div>

  <!-- Global Modals Container -->
  <div id="modalContainer"></div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

        { id: 'OUT-703', customer: 'Karan Johar', offer: 'Forex Travel Card & Multi-Currency Wallet', status: 'Contacted', owner: 'Priya Sen', lastContact: '2026-03-15', channel: 'Phone Call', cooldownUntil: '2026-03-30', notes: 'Customer traveling in April. Sent rate sheet via email.' },
        { id: 'OUT-704', customer: 'Neha Sharma', offer: 'SME Business Growth Credit Line', status: 'Declined', owner: 'Aarav Sharma', lastContact: '2026-03-10', channel: 'Phone Call', cooldownUntil: '2026-04-10', notes: 'Not interested at current interest rates.' }
      ],
      reminders: [
        { id: 'REM-11', title: 'Call Vikram Patel regarding top-up sanction', date: 'Today, 03:00 PM', type: 'Task', owner: 'Aarav Sharma', status: 'Active' },
        { id: 'REM-12', title: 'Submit audit compliance checklist to branch manager', date: '2026-03-18, 10:00 AM', type: 'Paperwork', owner: 'Aarav Sharma', status: 'Active' },
        { id: 'REM-13', title: 'Site visit with Meera Nair (Industrial Area)', date: '2026-03-19, 02:00 PM', type: 'Visit', owner: 'Aarav Sharma', status: 'Active' }
      ],
      auditLog: [
        { id: 'AUD-991', timestamp: '2026-03-16 09:15 AM', user: 'Aarav Sharma (PB-4029)', action: 'Claimed Outreach', details: 'Claimed outreach for Vikram Patel (Home Loan Top-Up).' },
        { id: 'AUD-990', timestamp: '2026-03-15 04:30 PM', user: 'Priya Sen (MGR-102)', action: 'Escalation Override', details: 'Extended TAT for Issue ISS-902 due to technical clearing outage.' },
        { id: 'AUD-989', timestamp: '2026-03-15 02:10 PM', user: 'Aarav Sharma (PB-4029)', action: 'Created Visit Record', details: 'Recorded visit VST-501 with Vikram Patel.' }
      ],
      teamWorkload: [
        { name: 'Aarav Sharma', role: 'Personal Banker', activeTasks: 5, pendingVisits: 2, outreachDone: 18, rating: '4.9/5' },

      adminSettings: {

        aiTranscriptionEnabled: true,
        approvedProcessVersion: 'v4.2-MAR2026'
      }
    };

    // Navigation configuration
    const navItems = [
      { id: 'my_day', label: 'My Day', icon: 'sun', roles: ['banker', 'manager', 'admin'] },
      { id: 'meeting_notes', label: 'Meeting Notes & AI', icon: 'mic', roles: ['banker', 'manager', 'admin'] },
      { id: 'visits', label: 'Visits', icon: 'map-pin', roles: ['banker', 'manager', 'admin'] },
      { id: 'customer_issues', label: 'Customer Issues', icon: 'alert-circle', roles: ['banker', 'manager', 'admin'] },
      { id: 'paperwork', label: 'Paperwork & Processes', icon: 'file-text', roles: ['banker', 'manager', 'admin'] },
      { id: 'customer_outreach', label: 'Customer Outreach', icon: 'users', roles: ['banker', 'manager', 'admin'] },
      { id: 'reminders', label: 'Reminders', icon: 'bell', roles: ['banker', 'manager', 'admin'] },
      { id: 'team_overview', label: 'Team Overview', icon: 'bar-chart-2', roles: ['manager', 'admin'] },
      { id: 'settings', label: 'Settings & Admin', icon: 'settings', roles: ['admin'] }
    ];

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar();
      renderActivePage();
      updateNotificationBadge();
      lucide.createIcons();
    });

    function switchRole(role) {
      currentUser.role = role;
      if (role === 'banker') {
        currentUser.name = 'Aarav Sharma';
        currentUser.id = 'PB-4029';
        document.getElementById('userRoleLabel').innerText = 'Personal Banker (ID: PB-4029)';
        document.getElementById('userNameLabel').innerText = 'Aarav Sharma';
        document.getElementById('userAvatar').innerText = 'AS';
      } else if (role === 'manager') {
        currentUser.name = 'Priya Sen';
        currentUser.id = 'MGR-102';
        document.getElementById('userRoleLabel').innerText = 'Branch Manager (ID: MGR-102)';
        document.getElementById('userNameLabel').innerText = 'Priya Sen';
        document.getElementById('userAvatar').innerText = 'PS';
      } else if (role === 'admin') {
        currentUser.name = 'Vikram Malhotra';
        currentUser.id = 'ADM-001';
        document.getElementById('userRoleLabel').innerText = 'System Admin (ID: ADM-001)';
        document.getElementById('userNameLabel').innerText = 'Vikram Malhotra';
        document.getElementById('userAvatar').innerText = 'VM';
      }

      // Update button styles
      ['banker', 'manager', 'admin'].forEach(r => {
        const btn = document.getElementById(`roleBtn${r.charAt(0).toUpperCase() + r.slice(1)}`);
        if (r === role) {
          btn.className = 'px-2.5 py-1 rounded transition-colors font-medium bg-indigo-600 text-white shadow';
        } else {
          btn.className = 'px-2.5 py-1 rounded transition-colors font-medium text-indigo-300 hover:text-white';
        }
      });

      // If manager/admin specific tab is active and user switches to banker, redirect to my_day
      const currentNavItem = navItems.find(n => n.id === activeTab);
      if (currentNavItem && !currentNavItem.roles.includes(role)) {
        activeTab = 'my_day';
      }

      renderSidebar();
      renderActivePage();
      showToast(`Switched role to ${currentUser.name} (${role.toUpperCase()})`, 'info');
    }

    function renderSidebar() {
      const navContainer = document.getElementById('sidebarNav');
      navContainer.innerHTML = '';

      navItems.forEach(item => {
        if (!item.roles.includes(currentUser.role)) return;

        const isActive = activeTab === item.id;
        const btn = document.createElement('button');
        btn.onclick = () => {
          activeTab = item.id;
          renderSidebar();
          renderActivePage();
        };
        btn.className = `w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium transition-all ${
          isActive 
            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' 
            : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
        }`;
        
        btn.innerHTML = `
          <i data-lucide="${item.icon}" class="w-4 h-4 ${isActive ? 'text-white' : 'text-slate-500'}"></i>
          <span>${item.label}</span>
        `;
        navContainer.appendChild(btn);
      });
      lucide.createIcons();
    }

    function renderActivePage() {
      const viewport = document.getElementById('mainViewport');
      viewport.innerHTML = '';

      switch(activeTab) {
        case 'my_day': renderMyDayPage(viewport); break;
        case 'meeting_notes': renderMeetingNotesPage(viewport); break;
        case 'visits': renderVisitsPage(viewport); break;
        case 'customer_issues': renderIssuesPage(viewport); break;
        case 'paperwork': renderPaperworkPage(viewport); break;
        case 'customer_outreach': renderOutreachPage(viewport); break;
        case 'reminders': renderRemindersPage(viewport); break;
        case 'team_overview': renderTeamOverviewPage(viewport); break;
        case 'settings': renderSettingsPage(viewport); break;
        default: viewport.innerHTML = `<div class="p-8">Page not found</div>`;
      }
      lucide.createIcons();
    }

    // --- PAGE 1: MY DAY DASHBOARD ---

                <span>Monday, March 16, 2026 • Branch #104</span>
              </div>

              <p class="text-xs text-slate-500 mt-0.5">You have <span class="font-semibold text-slate-700">${dueTodayCount} tasks due today</span> and <span class="font-semibold text-rose-600">${overdueCount} overdue items</span> requiring attention.</p>

                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>Log Interaction</span>
              </button>
              <button onclick="openAiAssistantModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all flex items-center space-x-2 border border-slate-200">
                <i data-lucide="sparkles" class="w-4 h-4 text-indigo-600"></i>
                <span>Ask AI Copilot</span>
              </button>
            </div>
          </div>

          <!-- Target Progress Section (Factual status, not sales pressure) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

              </div>
              <div class="text-2xl font-bold text-slate-900">${db.targets.meetingsCompleted.current} <span class="text-xs text-slate-400 font-normal">/ ${db.targets.meetingsCompleted.target}</span></div>

            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div class="flex justify-between items-start mb-3">
                <span class="text-xs font-medium text-slate-500">Paperwork Processed</span>
                <span class="text-[10px] bg-emerald-50 text-emerald-700 font-semibold px-2 py-0.5 rounded-full">SLA Compliant</span>
              </div>
              <div class="text-2xl font-bold text-slate-900">${db.targets.paperworkProcessed.current} <span class="text-xs text-slate-400 font-normal">/ ${db.targets.paperworkProcessed.target}</span></div>
              <div class="w-full bg-slate-100 rounded-full h-2 mt-3 overflow-hidden">
                <div class="bg-emerald-500 h-2 rounded-full" style="width: ${(db.targets.paperworkProcessed.current / db.targets.paperworkProcessed.target)*100}%"></div>
              </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">

    function claimOutreach(id) {
      const item = db.outreach.find(o => o.id === id);
      if (!item) return;

      // Check duplicate outreach safety warning
      if (item.status !== 'Unclaimed') {
        alert(`Duplicate Outreach Warning: Customer ${item.customer} is already claimed/contacted by ${item.owner}. Contact attempt blocked by conflict-safe rule.`);
        return;
      }

      item.status = 'Claimed';
      item.owner = currentUser.name;
      item.lastContact = 'Today';
      item.channel = 'Assigned';
      item.cooldownUntil = '2026-03-30';

      db.auditLog.unshift({
        id: 'AUD-' + Math.floor(Math.random()*900+100),
        timestamp: new Date().toISOString().replace('T', ' ').substring(0, 16),
        user: `${currentUser.name} (${currentUser.id})`,
        action: 'Claimed Outreach',
        details: `Claimed offer outreach for ${item.customer} (${item.offer}).`
      });

      showToast(`Successfully claimed outreach for ${item.customer}. Cooldown lock engaged.`, 'success');
      renderOutreachPage(document.getElementById('mainViewport'));
    }

                <textarea id="logNotes" rows="3" placeholder="Summary of discussion..." class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
              </div>
              <div class="pt-2 flex justify-end space-x-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl">Cancel</button>
                <button onclick="saveInteractionLog()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow">Save Record</button>
              </div>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function saveInteractionLog() {
      const cust = document.getElementById('logCustomer').value || 'Customer';
      showToast(`Interaction with ${cust} successfully saved to official record!`, 'success');
      closeModal();
    }

    // --- OTHER MODAL HELPERS ---
    function openNewReminderModal() {
      const container = document.getElementById('modalContainer');
      container.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden">
            <div class="p-4 bg-indigo-900 text-white flex justify-between items-center">
              <span class="font-bold text-sm">Create New Reminder</span>
              <button onclick="closeModal()" class="text-indigo-200 hover:text-white p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6 space-y-4 text-xs">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Reminder Title</label>
                <input type="text" id="remTitleInput" placeholder="e.g. Follow up on document submission" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Due Date & Time</label>
                  <input type="text" id="remDateInput" value="Today, 04:00 PM" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Category</label>
                  <select id="remTypeInput" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 bg-white">
                    <option>Task</option>
                    <option>Paperwork</option>
                    <option>Visit</option>
                    <option>Issue</option>
                  </select>
                </div>
              </div>
              <div class="pt-2 flex justify-end space-x-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl">Cancel</button>
                <button onclick="confirmNewReminder()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow">Create Reminder</button>
              </div>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function confirmNewReminder() {
      const title = document.getElementById('remTitleInput').value || 'New Reminder';
      const date = document.getElementById('remDateInput').value;
      const type = document.getElementById('remTypeInput').value;

      db.reminders.unshift({
        id: 'REM-' + Math.floor(Math.random()*90+10),
        title,
        date,
        type,
        owner: currentUser.name,
        status: 'Active'
      });

      showToast('Reminder successfully created and scheduled!', 'success');
      closeModal();
      renderActivePage();
    }

    function completeReminder(id) {
      db.reminders = db.reminders.filter(r => r.id !== id);
      showToast('Reminder completed and removed.', 'success');
      renderActivePage();
    }

    function toggleTaskStatus(id) {
      const task = db.tasks.find(t => t.id === id);
      if (task) {
        task.status = task.status === 'Completed' ? 'Pending' : 'Completed';
        showToast(`Task status updated to ${task.status}`, 'success');
        renderActivePage();
      }
    }

    function closeModal() {
      document.getElementById('modalContainer').innerHTML = '';
    }

    function toggleNotifications() {
      const dropdown = document.getElementById('notifDropdown');
      dropdown.classList.toggle('hidden');
      
      const list = document.getElementById('notifList');
      list.innerHTML = `
        <div class="p-3 hover:bg-slate-50 cursor-pointer">
          <div class="font-semibold text-xs text-slate-800">TAT Warning: Issue ISS-902</div>
          <div class="text-[10px] text-slate-500">Sunita Rao NEFT transfer expiring in 1 hour.</div>
        </div>
        <div class="p-3 hover:bg-slate-50 cursor-pointer">
          <div class="font-semibold text-xs text-slate-800">New Outreach Claim</div>
          <div class="text-[10px] text-slate-500">Vikram Patel top-up offer claimed by Aarav Sharma.</div>
        </div>
        <div class="p-3 hover:bg-slate-50 cursor-pointer">
          <div class="font-semibold text-xs text-slate-800">Compliance Audit Notice</div>
          <div class="text-[10px] text-slate-500">Monthly branch audit documentation due by Friday.</div>
        </div>
      `;
    }

    function updateNotificationBadge() {
      document.getElementById('notifBadge').innerText = '3';
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `p-4 rounded-xl shadow-2xl border text-xs font-semibold flex items-center space-x-2 transition-all transform translate-y-2 pointer-events-auto ${
        type === 'success' ? 'bg-slate-900 text-white border-slate-800' : 'bg-indigo-900 text-white border-indigo-800'
      }`;
      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle' : 'info'}" class="w-4 h-4 text-emerald-400"></i>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

      if (query.length > 2) {

      }

    function filterOutreachTable(query) {

    }

    function openRescheduleModal(id) {
      showToast(`Reschedule modal opened for task ${id}`, 'info');
    }

    function openNewVisitModal() {
      showToast('New visit logging modal opened.', 'info');
    }

    function openEditVisitModal(id) {
      showToast(`Editing visit record ${id}`, 'info');
    }

    function openNewIssueModal() {
      showToast('New customer issue modal opened.', 'info');
    }

    function openIssueDetailsModal(id) {
      showToast(`Managing issue ${id}`, 'info');
    }

    function openNewPaperworkModal() {
      showToast('New paperwork checklist item modal opened.', 'info');
    }

    function advancePaperworkStatus(id) {
      const doc = db.paperwork.find(d => d.id === id);
      if (doc) {
        doc.status = doc.status === 'Pending' ? 'Submitted' : doc.status === 'Submitted' ? 'Verified' : 'Pending';
        showToast(`Paperwork status for ${doc.customer} advanced to ${doc.status}`, 'success');
        renderActivePage();
      }
    }

    function openOutreachDetails(id) {
      showToast(`Opening shared outreach details for ${id}`, 'info');
    }
  </script>
